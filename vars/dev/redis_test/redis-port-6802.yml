# Service Name. Format redis-service-name
service_name: svc-name-3
# Redis Config
redis_port: 6802
redis_password: "pass_here"
master_user: master_user
redis_name: "{{ redis_port }}-redis-{{ service_name }}"
redis_config_name: "{{ redis_name }}.conf"
redis_config_path: "{{ config_dir }}/{{ redis_config_name }}"
db_filename: "{{ redis_name }}.rdb"
max_memory: 2gb
max_memory_policy: allkeys-lru
redis_log: /var/log/redis/{{ redis_name }}.log
# Redis Sentinel Config
sentinel_port: 8802
sentinel_name: "{{ sentinel_port }}-sentinel-{{ service_name }}"
sentinel_config_name: "{{ sentinel_name }}.conf"
sentinel_config_path: "{{ config_dir }}/{{ sentinel_config_name }}"
sentinel_log: /var/log/redis/{{ sentinel_name }}.log
# Exporter of Redis
exporter_version: "1.62.0"
exporter_port: 9802
# Notify Telegram:
telegram_token: "token_here"
telegram_chat_id: "chat_id_here"