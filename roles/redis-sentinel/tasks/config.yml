- block:
  # Redis installation
  - name: Update redis config {{ redis_name }}.conf with template for port {{ redis_port }}
    template:
      src: templates/redis.conf.j2
      dest: "{{ redis_config_path }}"
      owner: redis
      group: redis
      mode: 0644
    tags: redis_conf

  - name: Render redis-server service template for port {{ redis_port }}
    template:
      src: templates/redis-server.service.j2
      dest: /lib/systemd/system/redis-server-{{ redis_port }}.service
      owner: root
      group: root
      mode: 0644
    tags: redis_service
    notify: Reload systemd daemon after rendering redis-server service template

  - name: Enable and start redis-server-{{ redis_port }} service {{ service_name }}
    ansible.builtin.systemd:
      name: redis-server-{{ redis_port }}.service
      enabled: yes
      state: started
    tags: redis_service

  - name: Wait Redis port {{ redis_port }} Started
    wait_for:
      port: "{{ redis_port }}"

  # Exporter of Redis
  - name: Download Redis exporter version {{ exporter_version }}
    get_url:
      url: https://github.com/oliver006/redis_exporter/releases/download/v{{ exporter_version }}/redis_exporter-v{{ exporter_version }}.linux-amd64.tar.gz
      dest: /tmp/redis_exporter-v{{ exporter_version }}.linux-amd64.tar.gz
    tags: redis_exporter

  - name: Extract Redis exporter
    ansible.builtin.unarchive:
      src: /tmp/redis_exporter-v{{ exporter_version }}.linux-amd64.tar.gz
      dest: /tmp/
      remote_src: yes
      creates: /tmp/redis_exporter-v{{ exporter_version }}.linux-amd64/redis_exporter 
    tags: redis_exporter
    # creates parameter with the ansible.builtin.unarchive module. 
    # This parameter specifies a path to a file that will be checked before running the task. If the file exists, the task will be skipped

  - name: Move Redis exporter binary to /usr/local/bin
    ansible.builtin.command:
      cmd: mv /tmp/redis_exporter-v{{ exporter_version }}.linux-amd64/redis_exporter /usr/local/bin/redis_exporter
    args:
      creates: /usr/local/bin/redis_exporter
    tags: redis_exporter

  - name: Create Redis exporter systemd service for redis-exporter-{{ redis_port }} on exporter port {{ exporter_port }}
    ansible.builtin.template:
      src: "templates/redis_exporter.service.j2"
      dest: "/etc/systemd/system/redis-exporter-{{ redis_port }}.service"
      owner: root
      group: root
      mode: '0644'
    tags: redis_exporter
    notify: Reload systemd daemon for Redis exporter

  - name: Enable and start redis-exporter-{{ redis_port }} service on exporter port {{ exporter_port }}
    ansible.builtin.systemd:
      name: redis-exporter-{{ redis_port }}
      enabled: yes
      state: started
    tags: redis_exporter
  
  when: install_redis | bool
  
# SENTINEL CONFIG TASK
- block:
  - name: Setup notify script for Redis sentinel {{ sentinel_name }} {{ sentinel_port }} with template
    ansible.builtin.template:
      src: templates/notify_redis.py.j2
      dest: "/opt/notify_redis_{{ redis_port }}.py"
      owner: root
      group: root
      mode: 0755
    tags: sentinel_conf, sentinel_notify

  - name: Update sentinel config sentinel-{{ service_name }}.conf with template for sentinel port {{ sentinel_port }}
    template:
      src: templates/sentinel.conf.j2
      dest: "{{ sentinel_config_path }}"
      owner: redis
      group: redis
      mode: 0644
    tags: sentinel_conf

  - name: Render redis-sentinel service template for port {{ sentinel_port }}
    template:
      src: templates/redis-sentinel.service.j2
      dest: /lib/systemd/system/redis-sentinel-{{ sentinel_port }}.service
      owner: root
      group: root
      mode: 0644
    tags: sentinel_conf
    notify: Reload systemd daemon after rendering redis-sentinel service template {{ service_name }}

  - name: Enable and start redis-sentinel-{{ sentinel_port }} service
    ansible.builtin.systemd:
      name: redis-sentinel-{{ sentinel_port }}.service
      enabled: yes
      state: started
    tags: sentinel_conf

  - name: Wait Redis sentinel port {{ sentinel_port }} Started
    wait_for:
      port: "{{ sentinel_port }}"
  when: install_sentinel | bool
